<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Studio Store</title>
  <link rel="stylesheet" href="products.css">
</head>
<body>

  <header class="header">
    <h1>Studio Store</h1>
    <span>3 Products</span>
  </header>

  <nav class="categories">
    <button>All Products</button>
    <button>Headphones</button>
    <button>Speakers</button>
  </nav>

  <main class="products">

    <article class="card">
      <img src="https://placehold.co/400x200" alt="Headphones">
      <h2>Studio Monitor Pro</h2>
      <span class="badge">★ BESTSELLER</span>
      <p>Active noise canceling wireless cans with 40h battery.</p>
      <h3>$249.00</h3>
      <button class="cart">Add to Cart</button>
    </article>

    <article class="card">
      <img src="https://placehold.co/400x200" alt="Speaker">
      <h2>Studio Speaker</h2>
      <p>Powerful sound for music lovers and home studios.</p>
      <h3>$179.00</h3>
      <button class="cart">Add to Cart</button>
    </article>

    <article class="card">
      <img src="https://placehold.co/400x200" alt="Wireless headphones">
      <h2>Wireless Headphones</h2>
      <p>Comfortable headphones with long battery life for everyday use.</p>
      <h3>$129.00</h3>
      <button class="cart">Add to Cart</button>
    </article>

  </main>

</body>
</html>
